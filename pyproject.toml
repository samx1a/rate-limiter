[project]
name = "rate-limiter"
version = "0.1.0"
description = "Rate limiting from a naive counter to atomic Redis Lua scripts, served with FastAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Xia" }]
requires-python = ">=3.11"
keywords = ["rate limiting", "token bucket", "sliding window", "redis", "fastapi"]
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115",
    "redis>=5.0.1",  # Redis.from_pool
]

[project.urls]
Homepage = "https://rate-limiter-lac.vercel.app"
Source = "https://github.com/samx1a/rate-limiter"

[project.optional-dependencies]
# A server to run the app with. Vercel brings its own, so it isn't a core dependency.
serve = ["uvicorn[standard]>=0.30"]
dev = [
    "rate-limiter[serve]",
    "httpx2>=2.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratelimit", "webapp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["redis: needs a running Redis server (REDIS_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ratelimit", "webapp", "loadtest", "bench"]

[tool.vercel]
entrypoint = "webapp.main:app"

[tool.coverage.run]
branch = true
source = ["ratelimit", "webapp", "loadtest"]

[tool.coverage.report]
# 94% when this was added. The floor is there to catch a big untested chunk landing,
# not to chase 100%.
fail_under = 90
show_missing = true
skip_covered = true
