[project]
name = "rate-limiter"
version = "0.1.0"
description = "Rate limiting from a naive counter to atomic Redis Lua scripts, served with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["redis: needs a running Redis server (REDIS_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ratelimit", "webapp"]
