name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }}, Redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        redis: ["7"]
        include:
          - python: "3.12"
            redis: "6"
          # The live site runs on Redis 8.
          - python: "3.13"
            redis: "8"
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/0
      # Redis tests must run in CI: fail (don't skip) if Redis is missing.
      REQUIRE_REDIS: "1"
      # The service container exists only for these tests, so server-wide ones may run.
      REDIS_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -v --cov --cov-report=term

  free-threaded:
    # Python without the GIL: threads really run at the same time, so a missing lock
    # shows up far more often. Only the in-memory, thread-heavy tests run here (the
    # web stack's compiled dependencies don't all ship free-threaded builds yet).
    name: Thread safety (Python 3.14t, no GIL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
      - run: uv venv --python 3.14t
      - run: uv pip install pytest hypothesis redis
      - run: .venv/bin/python -c "import sys; assert not sys._is_gil_enabled()"
      - run: >-
          PYTHONPATH=. .venv/bin/python -m pytest -v
          tests/test_thread_safety.py tests/test_breaker.py tests/test_sweep.py
          tests/test_properties.py

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rate-limiter .
      - name: Start it and hit the API
        run: |
          docker run -d --name app -p 8000:8000 rate-limiter
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/info
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-user-id: ci' localhost:8000/api/hello)" = 200
          docker exec app id -u | grep -qx 10001  # not running as root
      - if: failure()
        run: docker logs app
      - name: Two servers from compose.yaml share one limit through Redis
        run: |
          docker compose up -d --build --wait
          codes=""
          for i in 1 2 3 4 5 6 7; do
            port=$((8001 + i % 2))
            codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -H 'x-user-id: ci' localhost:$port/api/hello)"
          done
          echo "$codes"
          test "$codes" = " 200 200 200 200 200 429 429"
      - if: failure()
        run: docker compose logs
