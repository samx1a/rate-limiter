# pip install pre-commit && pre-commit install
# Runs the fast checks on every commit, so lint and formatting never fail in CI.
# Recorded load test output stays byte-for-byte what the tool wrote.
exclude: ^docs/loadtest/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
